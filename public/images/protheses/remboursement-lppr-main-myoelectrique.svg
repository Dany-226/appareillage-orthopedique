<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chartTitle chartDesc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <title id="chartTitle">Prix LPPR des mains myoélectriques remboursées en France</title>
  <desc id="chartDesc">Comparatif des prix de prise en charge Sécurité sociale, chapitre 7 de la LPPR, révision du 3 novembre 2025.</desc>
  <style>
    .surface { fill: #fcfcfb; }
    .ink-primary { fill: #0b0b0b; }
    .ink-secondary { fill: #52514e; }
    .ink-muted { fill: #898781; }
    .bar { fill: #0B4F6C; }
    .gridline { stroke: #e1e0d9; stroke-width: 1; }
    .title { font-size: 20px; font-weight: 600; }
    .subtitle { font-size: 13px; }
    .label { font-size: 14px; font-weight: 600; }
    .sublabel { font-size: 11.5px; }
    .value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .footnote { font-size: 11px; }
  </style>
  <rect class="surface" x="0" y="0" width="760" height="460" rx="12"/>
  <text class="title ink-primary" x="24" y="34">Ce que rembourse la Sécurité sociale</text>
  <text class="subtitle ink-secondary" x="24" y="54">Prix LPPR TTC des mains myoélectriques inscrites au chapitre 7 (révision du 3 novembre 2025)</text>

  <text class="label ink-primary" x="24" y="96">MICHELANGELO</text>
  <text class="sublabel ink-secondary" x="24" y="111">Otto Bock - main complète</text>
  <path class="bar" d="M24,118 H480.0 Q484.0,118 484.0,122 V136 Q484.0,140 480.0,140 H24 Z"/>
  <text class="value ink-primary" x="494.0" y="134">32 275,00 €</text>
  <text class="label ink-primary" x="24" y="178">I-LIMB ULTRA</text>
  <text class="sublabel ink-secondary" x="24" y="193">Össur / Touch Bionics - main complète</text>
  <path class="bar" d="M24,200 H408.7 Q412.7,200 412.7,204 V218 Q412.7,222 408.7,222 H24 Z"/>
  <text class="value ink-primary" x="422.7" y="216">27 270,37 €</text>
  <text class="label ink-primary" x="24" y="260">I-DIGITS</text>
  <text class="sublabel ink-secondary" x="24" y="275">Össur - main partielle (pouce + 1 doigt)</text>
  <path class="bar" d="M24,282 H370.6 Q374.6,282 374.6,286 V300 Q374.6,304 370.6,304 H24 Z"/>
  <text class="value ink-primary" x="384.6" y="298">24 600,00 €</text>
  <text class="label ink-primary" x="24" y="342">MYOBOCK</text>
  <text class="sublabel ink-secondary" x="24" y="357">Otto Bock - référence historique (avant-bras)</text>
  <path class="bar" d="M24,364 H86.7 Q90.7,364 90.7,368 V382 Q90.7,386 86.7,386 H24 Z"/>
  <text class="value ink-primary" x="100.7" y="380">4 679,68 €</text>
  <line class="gridline" x1="24" y1="416" x2="736" y2="416"/>
  <text class="footnote ink-muted" x="24" y="436">Sources : chapitre 7 de la LPPR, révision du 3 novembre 2025 (prix hors options).</text>
  <text class="footnote ink-muted" x="24" y="452">Autres mains (TASKA, Hero Arm, Ability Hand, Vincent, COVVI) : non inscrites à la LPPR, donc non remboursées.</text>
</svg>