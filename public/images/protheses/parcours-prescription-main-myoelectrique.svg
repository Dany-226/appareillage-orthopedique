<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pathTitle pathDesc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
  <title id="pathTitle">Parcours de prescription d'une main myoélectrique remboursée</title>
  <desc id="pathDesc">Les quatre étapes obligatoires prévues par la LPPR, de la consultation à la garantie.</desc>
  <style>
    .surface { fill: #fcfcfb; }
    .ink-primary { fill: #0b0b0b; }
    .ink-secondary { fill: #52514e; }
    .accent-fill { fill: #E8923A; }
    .accent-text { fill: #ffffff; font-weight: 700; }
    .connector { stroke: #e1e0d9; stroke-width: 2; }
    .title { font-size: 20px; font-weight: 600; }
    .step-num { font-size: 17px; }
    .step-title { font-size: 14px; font-weight: 600; }
    .step-desc { font-size: 11.5px; }
  </style>
  <rect class="surface" x="0" y="0" width="760" height="320" rx="12"/>
  <text class="title ink-primary" x="24" y="32">Le parcours de prescription, étape par étape</text>
  <line class="connector" x1="147.0" y1="66" x2="613.0" y2="66"/>

  <circle class="accent-fill" cx="125.0" cy="66" r="22"/>
  <text class="accent-text step-num" x="125.0" y="72" text-anchor="middle">1</text>
  <text class="step-title ink-primary" x="125.0" y="112" text-anchor="middle">Équipe pluridisciplinaire</text>
  <text class="step-desc ink-secondary" x="125.0" y="132" text-anchor="middle">Médecin MPR ou</text>
  <text class="step-desc ink-secondary" x="125.0" y="147" text-anchor="middle">orthopédiste,</text>
  <text class="step-desc ink-secondary" x="125.0" y="162" text-anchor="middle">kinésithérapeute ou</text>
  <text class="step-desc ink-secondary" x="125.0" y="177" text-anchor="middle">ergothérapeute,</text>
  <text class="step-desc ink-secondary" x="125.0" y="192" text-anchor="middle">orthoprothésiste au</text>
  <text class="step-desc ink-secondary" x="125.0" y="207" text-anchor="middle">libre choix du</text>
  <text class="step-desc ink-secondary" x="125.0" y="222" text-anchor="middle">patient.</text>
  <circle class="accent-fill" cx="295.0" cy="66" r="22"/>
  <text class="accent-text step-num" x="295.0" y="72" text-anchor="middle">2</text>
  <text class="step-title ink-primary" x="295.0" y="112" text-anchor="middle">Essai préalable</text>
  <text class="step-desc ink-secondary" x="295.0" y="132" text-anchor="middle">Durée minimale de 4</text>
  <text class="step-desc ink-secondary" x="295.0" y="147" text-anchor="middle">semaines avant</text>
  <text class="step-desc ink-secondary" x="295.0" y="162" text-anchor="middle">toute prescription</text>
  <text class="step-desc ink-secondary" x="295.0" y="177" text-anchor="middle">définitive, avec</text>
  <text class="step-desc ink-secondary" x="295.0" y="192" text-anchor="middle">rééducation dès le</text>
  <text class="step-desc ink-secondary" x="295.0" y="207" text-anchor="middle">début de l'essai.</text>
  <circle class="accent-fill" cx="465.0" cy="66" r="22"/>
  <text class="accent-text step-num" x="465.0" y="72" text-anchor="middle">3</text>
  <text class="step-title ink-primary" x="465.0" y="112" text-anchor="middle">Bilan et prescription</text>
  <text class="step-desc ink-secondary" x="465.0" y="132" text-anchor="middle">Compte-rendu sur la</text>
  <text class="step-desc ink-secondary" x="465.0" y="147" text-anchor="middle">tolérance, les</text>
  <text class="step-desc ink-secondary" x="465.0" y="162" text-anchor="middle">prises utilisées et</text>
  <text class="step-desc ink-secondary" x="465.0" y="177" text-anchor="middle">la satisfaction du</text>
  <text class="step-desc ink-secondary" x="465.0" y="192" text-anchor="middle">patient, validé par</text>
  <text class="step-desc ink-secondary" x="465.0" y="207" text-anchor="middle">le médecin</text>
  <text class="step-desc ink-secondary" x="465.0" y="222" text-anchor="middle">prescripteur.</text>
  <circle class="accent-fill" cx="635.0" cy="66" r="22"/>
  <text class="accent-text step-num" x="635.0" y="72" text-anchor="middle">4</text>
  <text class="step-title ink-primary" x="635.0" y="112" text-anchor="middle">Garantie 5 ans</text>
  <text class="step-desc ink-secondary" x="635.0" y="132" text-anchor="middle">Maintenance</text>
  <text class="step-desc ink-secondary" x="635.0" y="147" text-anchor="middle">préventive aux 24e</text>
  <text class="step-desc ink-secondary" x="635.0" y="162" text-anchor="middle">et 48e mois, prise</text>
  <text class="step-desc ink-secondary" x="635.0" y="177" text-anchor="middle">en charge par le</text>
  <text class="step-desc ink-secondary" x="635.0" y="192" text-anchor="middle">fabricant, main de</text>
  <text class="step-desc ink-secondary" x="635.0" y="207" text-anchor="middle">prêt gratuite</text>
  <text class="step-desc ink-secondary" x="635.0" y="222" text-anchor="middle">pendant les</text>
  <text class="step-desc ink-secondary" x="635.0" y="237" text-anchor="middle">réparations.</text>
  <text class="step-desc ink-secondary" x="24" y="304">Mains myoélectriques inscrites à la LPPR - chapitre 7, révision du 3 novembre 2025.</text>
</svg>